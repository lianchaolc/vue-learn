<!--##
-1. **它是整个项目唯一的入口 HTML 文件**
浏览器最先加载这个文件，Vue 所有页面、组件最终都挂载在这里。

```
<div id="app"></div>
```

👉 这个 `#app` 就是挂载点，`main.js` 会把 Vue 应用渲染到这个 div 里面。

2. 引入 `main.js`

```
<script type="module" src="/src/main.js"></script>
```

Vite 从这里开始，顺着 `main.js` 去加载 Vue、路由、组件、样式。

3. 配置页面基础信息

- `charset="UTF-8"`：中文不乱码
- viewport：适配手机
- title：浏览器标签标题
- favicon：标签小图标
--->
